<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="div" style="border:1px solid;height:700px;width:400px;padding:20px">
        <h1 id="h1">Speed Typing Test</h1>
        <p id="para">On your fingers lets set Go!</p>

        <div>
            <p id="timer" >⏰<span id="timers"> 0</span> seconds</p>
        </div>

        <div id="sent"></div>
            <textarea id="input" placeholder="Type here..." rows="5"></textarea>
            <p id="message"></p>
            <button id="start" class="btn">Start</button>
            <button id="submit" class="btn">Submit</button>
            <button id="restart" class="btn">Restart</button>
        </div>
    </div>
    

    <script src = "project.js"></script>
</body>
</html>
